<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EZRA FC">
<meta name="theme-color" content="#07090f">
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>EZRA FOOTBALL CLUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
/* ── Reset & Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{
  height:100%;
  /* iOS Safari: prevent text size adjust on rotation */
  -webkit-text-size-adjust:100%;
}
body{
  font-family:'Noto Sans KR',sans-serif;
  background:#07090f;
  color:#e6ecf8;
  /* dvh = dynamic viewport height (excludes Safari toolbar).
     Order matters: the vh fallback MUST come first so that on
     browsers supporting dvh the later dvh declaration wins. */
  height:100vh; /* fallback for browsers without dvh */
  height:100dvh;
  overflow:hidden;
  position:fixed; /* iOS: prevent body scroll causing layout shift */
  width:100%;
  top:0;left:0;
  -webkit-font-smoothing:antialiased;
}

/* ── CSS Variables ── */
:root{
  --bg:#07090f;
  --bg2:#0c1018;
  --surf:#111620;
  --surf2:#171e2c;
  --surf3:#1d2638;
  --bdr:#1f2d40;
  --bdr2:#2a3c52;
  --txt:#e6ecf8;
  --txt2:#7a8fa8;
  --txt3:#3d5068;
  --grn:#22c55e;
  --grn2:#16a34a;
  --grn3:#052e16;
  --org:#f97316;
  --red:#ef4444;
  --blu:#3b82f6;
  --ylw:#eab308;
  --pur:#a855f7;
  /* Safe areas for iPhone notch/home bar */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --nav-h: 56px;
  --hdr-h: 52px;
}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:0;height:0;display:none}

/* ── App Shell ── */
#shell{
  display:flex;
  flex-direction:column;
  /* Use dvh with vh fallback — vh first so dvh wins where supported */
  height:100vh;
  height:100dvh;
  /* Respect safe areas */
  padding-top:var(--sat);
  padding-left:var(--sal);
  padding-right:var(--sar);
}

/* ── Header ── */
#hdr{
  height:var(--hdr-h);
  background:var(--surf);
  border-bottom:1px solid var(--bdr);
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:12px;
  flex-shrink:0;
  position:relative;
  z-index:20;
}
.hdr-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:20px;
  letter-spacing:3px;
  color:var(--grn);
  flex-shrink:0;
}
.hdr-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:20px;
  letter-spacing:2px;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  pointer-events:none;
}
.hdr-right{
  display:flex;
  align-items:center;
  gap:8px;
}
.sync-btn{
  margin-left:auto;      /* pushes sync + hdr-right group to the right */
  display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;flex-shrink:0;
  border:1px solid var(--bdr);border-radius:9px;
  background:var(--surf2);color:var(--txt2);
  font-size:15px;line-height:1;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:opacity .12s,border-color .15s;
  position:relative;
}
.sync-btn:active{opacity:.7}
.sync-btn.on{border-color:var(--grn);box-shadow:0 0 0 1px var(--grn) inset}
.sync-btn .dot{
  position:absolute;top:-2px;right:-2px;
  width:9px;height:9px;border-radius:50%;
  border:2px solid var(--surf);
  background:var(--txt3);
}
.sync-btn.on .dot{background:var(--grn)}

/* ── Content area ── */
#page{
  flex:1;
  /* Critical: overflow:auto + -webkit-overflow-scrolling for iOS momentum scroll */
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  /* Bottom padding = nav height + home bar */
  padding-bottom:calc(var(--nav-h) + var(--sab));
  position:relative;
}

/* ── Bottom Nav ── */
#nav{
  height:calc(var(--nav-h) + var(--sab));
  padding-bottom:var(--sab);
  background:var(--surf);
  border-top:1px solid var(--bdr);
  display:flex;
  flex-shrink:0;
  position:relative;
  z-index:20;
}
.nav-tab{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  cursor:pointer;
  border:none;
  background:none;
  color:var(--txt3);
  font-size:9px;
  font-family:'Noto Sans KR',sans-serif;
  font-weight:600;
  letter-spacing:.3px;
  padding:8px 2px 4px;
  transition:color .15s;
  /* Min touch target 44x44 per Apple HIG */
  min-height:44px;
  -webkit-tap-highlight-color:transparent;
}
.nav-tab .ico{font-size:19px;line-height:1;transition:transform .15s}
.nav-tab.on{color:var(--grn)}
.nav-tab.on .ico{transform:scale(1.12)}

/* ── Buttons ── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  /* font-size >= 16px prevents iOS auto-zoom */
  font-size:16px;
  font-weight:700;font-family:'Noto Sans KR',sans-serif;
  cursor:pointer;border:none;border-radius:10px;
  padding:11px 20px;transition:opacity .12s,transform .12s;
  -webkit-tap-highlight-color:transparent;
  /* min 44pt touch target */
  min-height:44px;
}
.btn:active{opacity:.75;transform:scale(.97)}
.btn-g{background:linear-gradient(135deg,var(--grn2),var(--grn));color:#fff}
.btn-s{background:var(--surf2);color:var(--txt2);border:1px solid var(--bdr)}
.btn-d{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.18)}
.btn-sm{font-size:13px;padding:8px 14px;min-height:36px}
.btn-xs{font-size:12px;padding:5px 11px;min-height:32px;border-radius:8px}

/* ── Badge ── */
.badge{
  display:inline-flex;align-items:center;
  padding:2px 8px;border-radius:20px;
  font-size:10px;font-weight:700;letter-spacing:.3px;
}

/* ── Card ── */
.card{
  background:var(--surf);
  border:1px solid var(--bdr);
  border-radius:14px;
}

/* ── Horizontal scroll strip ── */
.hscroll{
  display:flex;gap:10px;
  overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  padding:14px 16px;
  /* Prevent scroll chaining */
  overscroll-behavior-x:contain;
}
.hscroll::-webkit-scrollbar{display:none}

/* ── Stat card ── */
.stat-card{
  background:var(--surf);border:1px solid var(--bdr);border-radius:14px;
  padding:14px 15px;flex-shrink:0;min-width:120px;
}
.stat-ico{font-size:18px;margin-bottom:6px}
.stat-lbl{font-size:9px;color:var(--txt3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;letter-spacing:1px}
.stat-sub{font-size:10px;color:var(--txt3);margin-top:3px}

/* ── Section ── */
.sec{padding:14px 16px}
.sec-title{font-size:13px;font-weight:700;color:var(--txt);margin-bottom:10px}

/* ── Member row ── */
.mrow{
  display:flex;align-items:center;gap:11px;
  padding:12px 16px;
  border-bottom:1px solid rgba(31,45,64,.6);
  cursor:pointer;
  /* Active state for iOS (no :hover) */
  -webkit-tap-highlight-color:rgba(22,163,74,.06);
  transition:background .1s;
}
.mrow:active{background:var(--surf2)}
.mrow:last-child{border-bottom:none}
.ava{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;flex-shrink:0;
}
.minfo{flex:1;min-width:0}
.mname{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.msub{font-size:11px;color:var(--txt2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mright{text-align:right;flex-shrink:0}
.mfee{font-size:12px;font-weight:700;margin-bottom:2px}
.mpaid{font-size:10px;font-weight:700}

/* ── Search ── */
.search-box{
  padding:10px 16px;
  background:var(--surf);border-bottom:1px solid var(--bdr);
  position:sticky;top:0;z-index:10;
}
.search-inner{position:relative}
.search-inner input{
  width:100%;
  /* 16px prevents iOS zoom! */
  font-size:16px;
  font-family:'Noto Sans KR',sans-serif;
  background:var(--surf2);border:1px solid var(--bdr);color:var(--txt);
  border-radius:10px;padding:10px 12px 10px 36px;outline:none;
  -webkit-appearance:none;
  transition:border-color .2s;
}
.search-inner input:focus{border-color:var(--grn)}
.search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;color:var(--txt3)}

/* ── Chips ── */
.chips{
  display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:8px 16px;overscroll-behavior-x:contain;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  padding:6px 13px;border-radius:20px;font-size:11px;font-weight:600;
  cursor:pointer;background:var(--surf2);color:var(--txt2);border:1px solid var(--bdr);
  white-space:nowrap;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
  transition:all .12s;
}
.chip.on{background:rgba(34,197,94,.1);color:var(--grn);border-color:rgba(34,197,94,.25)}

/* ── Progress ── */
.prog-wrap{display:flex;align-items:center;gap:6px;margin-top:4px}
.prog-bg{flex:1;background:var(--bdr);border-radius:3px;height:4px;min-width:40px}
.prog-fill{height:100%;border-radius:3px;transition:width .4s}

/* ── Attendance ── */
.att-card{
  display:flex;justify-content:space-between;align-items:center;
  padding:11px 13px;border-radius:10px;border:1px solid var(--bdr);
  background:var(--bg2);cursor:pointer;margin-bottom:6px;
  -webkit-tap-highlight-color:transparent;
  transition:border-color .12s,background .12s;
}
.att-card:active{opacity:.75}
.att-card.present{background:rgba(5,46,22,.7);border-color:#14532d}
.att-card.late{background:rgba(28,23,0,.7);border-color:#713f12}
.att-status{font-size:12px;font-weight:700}
.att-status.present{color:var(--grn)}
.att-status.late{color:var(--ylw)}
.att-status.absent{color:var(--txt3)}

/* ── Calendar ── */
.cal-nav{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;border-bottom:1px solid var(--bdr);
}
.cal-month-lbl{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 10px 4px}
.cal-wday{text-align:center;font-size:9px;color:var(--txt3);padding:5px 0;font-weight:700;letter-spacing:.5px}
.cal-day{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;border-radius:8px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background .1s;
  padding:2px;
}
.cal-day:active{background:var(--surf2)}
.cal-day.is-today{background:rgba(34,197,94,.08)}
.cal-day.is-sel{background:rgba(34,197,94,.18);border:1px solid rgba(34,197,94,.35)}
.cal-dn{font-size:11px;font-weight:500;line-height:1;margin-bottom:2px}
.cal-day.is-today .cal-dn{color:var(--grn);font-weight:700}
.cal-day.is-sel .cal-dn{color:var(--grn)}
.cal-dots{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;max-width:22px}
.cal-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}

/* ── Event card ── */
.ev-card{
  background:var(--surf);border:1px solid var(--bdr);border-radius:10px;
  padding:12px 13px;margin-bottom:8px;
  border-left-width:3px;border-left-style:solid;
}

/* ── Pay card ── */
.pay-card{
  display:flex;justify-content:space-between;align-items:center;
  padding:11px 13px;border-radius:10px;border:1px solid var(--bdr);
  background:var(--bg2);margin-bottom:6px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.pay-card:active{opacity:.75}
.pay-card.paid{background:rgba(5,46,22,.65);border-color:#14532d}
.pay-card.unpaid{background:rgba(26,10,10,.65);border-color:#7f1d1d}

/* ── Bottom Sheet ── */
.sheet-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.65);
  z-index:100;
  display:none;
  opacity:0;
  transition:opacity .22s;
  /* Fix: use -webkit-backdrop-filter for Safari */
  -webkit-backdrop-filter:blur(4px);
  backdrop-filter:blur(4px);
}
.sheet-overlay.open{opacity:1}
.sheet{
  position:fixed;
  bottom:0;left:0;right:0;
  background:var(--surf);
  border-radius:20px 20px 0 0;
  border-top:1px solid var(--bdr2);
  /* Max height leaves space to tap to close */
  max-height:90dvh;
  max-height:90vh;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  /* Safe area at bottom */
  padding-bottom:calc(20px + var(--sab));
  transform:translateY(100%);
  transition:transform .28s cubic-bezier(.32,1.1,.4,1);
  z-index:101;
  will-change:transform;
}
.sheet.open{transform:translateY(0)}
.sheet-handle{
  width:36px;height:4px;background:var(--bdr2);border-radius:3px;
  margin:12px auto 0;
}
.sheet-hdr{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 18px 8px;
}
.sheet-ttl{font-size:17px;font-weight:700}
.sheet-close{
  width:30px;height:30px;border-radius:50%;
  background:var(--surf2);border:none;color:var(--txt2);
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.sheet-body{padding:0 18px 8px}

/* ── Form ── */
.fg{margin-bottom:12px}
.fl{
  display:block;font-size:10px;color:var(--txt3);
  letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;
}
/* font-size 16px everywhere = no iOS zoom */
.fi{
  width:100%;font-size:16px;font-family:'Noto Sans KR',sans-serif;
  background:var(--bg2);border:1px solid var(--bdr);color:var(--txt);
  border-radius:10px;padding:11px 13px;outline:none;
  -webkit-appearance:none;transition:border-color .2s;
}
.fi:focus{border-color:var(--grn)}
.fi-fee{
  background:var(--bg);border-radius:10px;padding:11px 13px;
  display:flex;flex-direction:column;justify-content:center;min-height:46px;
}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f-actions{display:flex;gap:8px;padding-top:6px}

/* ── Member detail ── */
.det-hdr{
  text-align:center;padding:18px 16px 14px;
  border-bottom:1px solid var(--bdr);
}
.det-ava{
  width:60px;height:60px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:700;margin:0 auto 10px;
}
.det-name{font-size:19px;font-weight:700;margin-bottom:4px}
.det-phone{font-size:13px;color:var(--txt2);margin-bottom:8px}
.info-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:7px;
  padding:12px 16px;
}
.info-cell{background:var(--bg2);border-radius:9px;padding:10px 12px}
.info-lbl{font-size:9px;color:var(--txt3);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.info-val{font-size:13px;font-weight:600}

/* ── Toast ── */
.toast{
  position:fixed;
  /* Above bottom nav */
  bottom:calc(var(--nav-h) + var(--sab) + 12px);
  left:16px;right:16px;
  background:var(--surf2);border:1px solid var(--bdr2);
  border-radius:12px;padding:12px 16px;
  font-size:14px;text-align:center;font-weight:600;
  z-index:200;
  opacity:0;transform:translateY(6px);
  transition:opacity .2s,transform .2s;
  pointer-events:none;
  box-shadow:0 8px 28px rgba(0,0,0,.4);
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{color:var(--grn);border-color:rgba(34,197,94,.25)}
.toast.err{color:var(--red);border-color:rgba(239,68,68,.25)}

/* ── Animations ── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.fade{animation:fadeUp .2s ease both}

/* ── Empty state ── */
.empty{text-align:center;padding:48px 20px;color:var(--txt3)}
.empty-ico{font-size:38px;margin-bottom:10px}
.empty-txt{font-size:14px}

/* ── Pagination ── */
.pager{
  display:flex;justify-content:center;align-items:center;
  gap:8px;padding:14px 16px;
}
.pager-btn{
  min-height:40px;padding:8px 16px;font-size:13px;
  border-radius:9px;border:1px solid var(--bdr);
  background:var(--surf2);color:var(--txt2);cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;font-weight:600;
  -webkit-tap-highlight-color:transparent;
}
.pager-btn:disabled{opacity:.3;pointer-events:none}
.pager-info{font-size:12px;color:var(--txt3)}

/* ── Divider ── */
.divider{height:1px;background:var(--bdr);margin:0 16px}

/* ── Group label ── */
.grp-lbl{
  font-size:11px;font-weight:700;color:var(--txt2);
  padding:10px 16px 6px;letter-spacing:.5px;
}

/* ── Pay toggle btn ── */
.pay-toggle{
  width:100%;padding:13px;border-radius:12px;border:none;
  cursor:pointer;font-size:15px;font-weight:700;
  font-family:'Noto Sans KR',sans-serif;
  -webkit-tap-highlight-color:transparent;
  transition:opacity .12s;
}
.pay-toggle:active{opacity:.75}
</style>
</head>
<body>
<div id="shell">
  <header id="hdr">
    <div class="hdr-logo">⚽ EZRA FC</div>
    <div class="hdr-title" id="hdrTitle">대시보드</div>
    <button class="sync-btn" id="syncBtn" onclick="openSyncSheet()" title="기기 동기화">☁️</button>
    <div class="hdr-right" id="hdrRight"></div>
  </header>
  <main id="page"></main>
  <nav id="nav"></nav>
</div>

<!-- Sheet overlay -->
<div class="sheet-overlay" id="overlay" onclick="closeSheet()">
  <div class="sheet" id="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-hdr">
      <div class="sheet-ttl" id="sheetTitle"></div>
      <button class="sheet-close" onclick="closeSheet()">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase (compat SDK) for PC ↔ phone realtime sync.
     Loaded before the app script so window.firebase is available.
     If offline / blocked, the app falls back to localStorage. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
'use strict';
/* ─── Constants ────────────────────────────────────────────────────────────── */
const CATS    = ['성인','청소년','유소년'];       // 구분
const CATK    = {'성인':'ad','청소년':'te','유소년':'yo'};
const TERMS   = ['2','3'];              // 회원제 결제 개월 (2달치 / 3달치)
const FREQS   = [1,2,3,4,5];            // 주 N회
const WEEKS_PER_MONTH = 4;              // 1달 = 4주 (총 횟수 산정 기준)
const POS     = ['FW','MF','DF','GK','없음'];
const STATS   = ['활성','휴강','대기'];
const STC     = {활성:'#22c55e',휴강:'#f97316',대기:'#6b7280'};
const LTC_PAL = ['#3b82f6','#22c55e','#f97316','#a855f7','#ef4444','#06b6d4','#eab308','#ec4899'];
const ECOLS   = ['#22c55e','#3b82f6','#f97316','#a855f7','#ef4444','#06b6d4'];

// 설정 접근 헬퍼
function ltypeNames(){ return cfg.ltypes.map(t=>t.name); }
function ltypeObj(name){ return cfg.ltypes.find(t=>t.name===name); }
function isMembership(name){ const t=ltypeObj(name); return t?!!t.membership:false; }
function ltColor(name){ const i=cfg.ltypes.findIndex(t=>t.name===name); return LTC_PAL[(i<0?0:i)%LTC_PAL.length]; }
// 요금 값을 1일 단가(숫자)로 변환. 구버전 월단가 객체({f1..})는 주1회 월단가÷4주로 근사.
function dailyFrom(v){
  if(typeof v==='number') return v;
  if(v && typeof v==='object' && typeof v.f1==='number') return Math.round(v.f1/WEEKS_PER_MONTH);
  return 0;
}

// 설정 구조 보정 — 누락/구버전 데이터도 안전하게 채웁니다.
// 회원제 유형은 unified(성인·유소년 통합)이면 {all:1일단가}, 아니면 {성인,유소년:1일단가} 구조.
function normalizeCfg(){
  if(!cfg || typeof cfg!=='object') cfg = clone(DEFAULT_CONFIG);
  if(!Array.isArray(cfg.ltypes) || !cfg.ltypes.length) cfg.ltypes = clone(DEFAULT_CONFIG.ltypes);
  if(!Array.isArray(cfg.groups) || !cfg.groups.length) cfg.groups = DEFAULT_CONFIG.groups.slice();
  if(!Array.isArray(cfg.coaches) || !cfg.coaches.length) cfg.coaches = DEFAULT_CONFIG.coaches.slice();
  if(!cfg.termDiscount || typeof cfg.termDiscount!=='object') cfg.termDiscount = {'2':0,'3':0};
  TERMS.forEach(t=>{ if(typeof cfg.termDiscount[t]!=='number') cfg.termDiscount[t]=0; });
  if(!cfg.pricing || typeof cfg.pricing!=='object') cfg.pricing = {};
  cfg.ltypes.forEach(t=>{
    const cur = cfg.pricing[t.name] || {};
    if(t.membership){
      if(t.unified){
        cfg.pricing[t.name] = { all: dailyFrom(cur.all!=null?cur.all:(cur[CATS[0]]!=null?cur[CATS[0]]:cur[CATS[1]])) };
      } else {
        const o={}; CATS.forEach(cat=>{ o[cat]=dailyFrom(cur[cat]!=null?cur[cat]:cur.all); }); cfg.pricing[t.name]=o;
      }
    } else {
      if(typeof cur.once!=='number') cfg.pricing[t.name] = {once:(cur.once)||0};
    }
  });
}

// 할인 전 기본 금액(원). 회원제 = 1일단가 × 주횟수 × 4주 × 개월수, 원포인트 = 단일 요금.
function baseFee(m){
  const p = cfg.pricing[m.ltype]; if(!p) return 0;
  if(!isMembership(m.ltype)) return Number(p.once)||0;
  const t = ltypeObj(m.ltype);
  const daily = (t && t.unified) ? (Number(p.all)||0) : (Number(p[m.cat]!=null ? p[m.cat] : p['성인'])||0);
  const sessions = (m.freq||1) * WEEKS_PER_MONTH * (m.term==='3'?3:2);
  return daily * sessions;
}
// 총 할인율(%) = 결제개월 할인(회원제) + 회원별 할인, 0~100 제한.
function discPct(m){
  const term = isMembership(m.ltype) ? (Number(cfg.termDiscount && cfg.termDiscount[m.term])||0) : 0;
  const indiv = Number(m.discount)||0;
  return Math.max(0, Math.min(100, term + indiv));
}
// 실제 결제 금액(할인 적용).
function memberFee(m){ return Math.round(baseFee(m) * (1 - discPct(m)/100)); }
// 결제 단위 라벨 (예: "주2회 · 3달치", "1일")
function feeUnit(m){ return isMembership(m.ltype) ? `주${m.freq||1}회 · ${m.term==='3'?'3':'2'}달치` : '1일'; }

/* ─── Persistence, Auth & Sync (localStorage + Firebase Auth + RTDB) ──────────────
   • Data always persists per-device via localStorage.
   • With Firebase configured, signing in with the SAME account on a PC and a
     phone keeps their data in realtime sync. Each account's data lives at
     academies/{uid} and is private to that account (enforced by security rules).
   • Signed out (or Firebase unconfigured) → local-only mode; the app still works.
   ────────────────────────────────────────────────────────────────────────────── */

const LS_DATA = 'academyPro:data';

let fbDb = null;             // Realtime Database instance
let fbAuth = null;           // Auth instance
let fbRef = null;            // realtime ref to the signed-in user's data
let currentUser = null;      // signed-in Firebase user (null = signed out)
let applyingRemote = false;  // guard so remote updates don't echo back
let saveTmr = null;          // debounce timer

function firebaseReady(){
  return typeof firebase !== 'undefined'
    && !!FIREBASE_CONFIG.apiKey && !!FIREBASE_CONFIG.databaseURL;
}
function signedIn(){ return !!currentUser; }
function syncActive(){ return !!fbRef; }

function snapshot(){ return { members, att, evts, cfg }; }
function applyData(d){
  if(!d || typeof d !== 'object') return false;
  members = Array.isArray(d.members) ? d.members : [];
  att     = (d.att && typeof d.att === 'object') ? d.att : {};
  evts    = Array.isArray(d.evts) ? d.evts : [];
  if(d.cfg && typeof d.cfg === 'object') cfg = d.cfg;                 // 신 구조
  else if(d.pricing && typeof d.pricing === 'object') cfg.pricing = d.pricing; // 구버전 호환
  normalizeCfg();
  return true;
}

function saveLocal(){
  try{ localStorage.setItem(LS_DATA, JSON.stringify(snapshot())); }catch(e){}
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_DATA);
    if(raw) return applyData(JSON.parse(raw));
  }catch(e){}
  return false;
}

// Called after every mutation. Saves locally + pushes to Firebase (debounced).
function persist(){
  if(applyingRemote) return;          // don't write while applying a remote change
  saveLocal();
  if(!syncActive()) return;
  clearTimeout(saveTmr);
  saveTmr = setTimeout(()=>{
    fbRef.set({ ...snapshot(), _updated: Date.now() })
      .catch(err=>console.warn('[sync] write failed', err));
  }, 250);
}

// Attach the realtime listener for the signed-in user's private data.
function connectUser(){
  if(fbRef){ try{ fbRef.off(); }catch(e){} fbRef = null; }
  if(!fbDb || !currentUser) return;
  fbRef = fbDb.ref('academies/' + currentUser.uid);
  fbRef.on('value', snap=>{
    const d = snap.val();
    if(!d){                        // first sign-in with no cloud data → upload local
      persist();
      updateSyncBtn();
      return;
    }
    applyingRemote = true;
    applyData(d);
    applyingRemote = false;
    saveLocal();
    if(typeof renderPage === 'function'){ renderNav(); renderPage(); }
    updateSyncBtn();
  }, err=>console.warn('[sync] listen failed', err));
  updateSyncBtn();
}
function disconnectUser(){
  if(fbRef){ try{ fbRef.off(); }catch(e){} fbRef = null; }
  updateSyncBtn();
}

// Boot the data layer: load local → init Firebase + auth listener → seed if empty.
function initData(){
  const hadLocal = loadLocal();
  normalizeCfg();

  if(firebaseReady()){
    try{
      if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      fbDb   = firebase.database();
      fbAuth = firebase.auth();
      fbAuth.onAuthStateChanged(u=>{
        currentUser = u || null;
        if(currentUser) connectUser(); else disconnectUser();
        updateSyncBtn();
        // keep the account sheet fresh if it's open
        if(document.getElementById('authPanel')) openSyncSheet();
      });
    }catch(e){ console.warn('[sync] init failed', e); fbDb = null; fbAuth = null; }
  }

  if(!hadLocal && !members.length){   // first ever run on this device
    seedData();
    saveLocal();
  }
}

function bindMemberEvents(){
  const si=$('srchInput');
  if(si){
    si.addEventListener('input',function(){srch=this.value;pg=1;reMlist();});
    // iOS: prevent page scroll while in search
    si.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
  }
  $('chips1')?.addEventListener('click',e=>{
    const v=e.target.dataset.fgrp;
    if(v!==undefined){fGrp=v;pg=1;reMlist();
      $('chips1').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.fgrp===v));
    }
  });
  $('chips2')?.addEventListener('click',e=>{
    const lv=e.target.dataset.flvl, sv=e.target.dataset.fstat;
    if(lv!==undefined){fLvl=lv;pg=1;reMlist();
      $('chips2').querySelectorAll('[data-flvl]').forEach(c=>c.classList.toggle('on',c.dataset.flvl===lv));
    }
    if(sv!==undefined){fStat=sv;pg=1;reMlist();
      $('chips2').querySelectorAll('[data-fstat]').forEach(c=>c.classList.toggle('on',c.dataset.fstat===sv));
    }
  });
  reMlist();
}

function reMlist(){
  const fm=filtered();
  const tp=Math.ceil(fm.length/PGS)||1;
  if(pg>tp) pg=tp;
  const slice=fm.slice((pg-1)*PGS,pg*PGS);
  $('mlist').innerHTML=`
    <div style="padding:8px 16px 4px;font-size:11px;color:var(--txt3)">${fm.length}명 조회 중</div>
    <div class="card" style="margin:0 16px;overflow:hidden">
      ${slice.map(m=>`
        <div class="mrow" onclick="openMemberDetail('${m.id}')">
          <div class="ava" style="background:${ltColor(m.ltype)}20;color:${ltColor(m.ltype)}">${m.name[0]}</div>
          <div class="minfo">
            <div class="mname">${h(m.name)}
              <span class="badge" style="background:${ltColor(m.ltype)}20;color:${ltColor(m.ltype)}">${h(m.ltype)}</span>
              ${isMembership(m.ltype)?`<span class="badge" style="background:var(--surf3);color:var(--txt2)">${h(m.cat)}</span>`:`<span class="badge" style="background:var(--surf3);color:var(--txt2)">비회원</span>`}
            </div>
            <div class="msub">${h(m.group)} · ${m.coach} · <span style="color:${STC[m.status]}">${m.status}</span></div>
            <div class="prog-wrap">
              <div class="prog-bg"><div class="prog-fill" style="width:${attRate(m.id)}%;background:${attRate(m.id)>70?'var(--grn)':attRate(m.id)>40?'var(--org)':'var(--red)'}"></div></div>
              <span style="font-size:10px;color:var(--txt3)">${attRate(m.id)}%</span>
            </div>
          </div>
          <div class="mright">
            <div class="mfee">${~~(memberFee(m)/10000)}만원</div>
            <div style="font-size:9px;color:var(--txt3)">${feeUnit(m)}</div>
            <div class="mpaid" style="color:${m.paid?'var(--grn)':'var(--org)'}">${m.paid?'납부':'미납'}</div>
          </div>
        </div>`).join('')}
      ${!slice.length?`<div class="empty"><div class="empty-ico">🔍</div><div class="empty-txt">검색 결과 없음</div></div>`:''}
    </div>`;
  $('mpager').innerHTML=tp>1?`
    <div class="pager">
      <button class="pager-btn" onclick="pg=Math.max(1,pg-1);reMlist()" ${pg===1?'disabled':''}>‹ 이전</button>
      <span class="pager-info">${pg} / ${tp}</span>
      <button class="pager-btn" onclick="pg=Math.min(${tp},pg+1);reMlist()" ${pg===tp?'disabled':''}>다음 ›</button>
    </div>`:'';
}

/* ─── Attendance ─────────────────────────────────────────────────────────────── */
function vAtt(){
  const gm=members.filter(m=>attGrp==='전체'||m.group===attGrp);
  const pres=gm.filter(m=>att[m.id]?.[attDate]==='present').length;
  const late=gm.filter(m=>att[m.id]?.[attDate]==='late').length;
  return`
<div style="padding:10px 16px 8px;background:var(--surf);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:10">
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">
    <input type="date" class="fi" style="flex:1" value="${attDate}" onchange="attDate=this.value;renderPage()">
    <div style="font-size:13px;white-space:nowrap;font-weight:700">
      <span style="color:var(--grn)">${pres}</span> / <span style="color:var(--ylw)">${late}</span> / <span style="color:var(--red)">${gm.length-pres-late}</span>
    </div>
  </div>
  <div class="chips" style="padding:0;margin:0">
    <span class="chip ${attGrp==='전체'?'on':''}" onclick="attGrp='전체';renderPage()">전체</span>
    ${cfg.groups.map(g=>`<span class="chip ${attGrp===g?'on':''}" onclick="attGrp='${h(g)}';renderPage()">${h(g)}</span>`).join('')}
    <button class="btn btn-g" style="flex-shrink:0;font-size:12px;min-height:32px;padding:6px 12px;border-radius:8px;margin-left:4px" onclick="markAll('present')">전체 출석</button>
  </div>
</div>
<div class="sec">
  <div style="font-size:11px;color:var(--txt3);margin-bottom:10px">탭 → 출석 ✓ · 지각 ! · 결석 (순서 변경)</div>
  ${cfg.groups.filter(g=>attGrp==='전체'||attGrp===g).map(g=>{
    const gms=members.filter(m=>m.group===g);
    if(!gms.length) return '';
    const gp=gms.filter(m=>att[m.id]?.[attDate]==='present').length;
    return`<div style="margin-bottom:16px">
      <div style="font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:7px">${h(g)} <span style="color:var(--txt3);font-weight:400">${gp}/${gms.length}</span></div>
      ${gms.map(m=>{
        const s=att[m.id]?.[attDate];
        const lbl=s==='present'?'출석 ✓':s==='late'?'지각 !':'결석';
        return`<div class="att-card ${s||'absent'}" onclick="cycleAtt('${m.id}')">
          <div>
            <div style="font-size:13px;font-weight:700">${h(m.name)}</div>
            <div style="font-size:10px;color:var(--txt3)">${h(m.ltype)} · 출석률 ${attRate(m.id)}%</div>
          </div>
          <div class="att-status ${s||'absent'}">${lbl}</div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('')}
</div>`;
}
function cycleAtt(id){
  if(!att[id]) att[id]={};
  const c=att[id][attDate];
  if(!c) att[id][attDate]='present';
  else if(c==='present') att[id][attDate]='late';
  else delete att[id][attDate];
  persist();
  renderPage();
}
function markAll(s){
  members.filter(m=>attGrp==='전체'||m.group===attGrp).forEach(m=>{
    if(!att[m.id]) att[m.id]={};
    att[m.id][attDate]=s;
  });
  persist();
  renderPage(); toast2('전체 출석 처리 완료');
}

/* ─── Schedule ───────────────────────────────────────────────────────────────── */
function vSched(){
  const ms=`${calY}-${String(calM+1).padStart(2,'0')}`;
  const mEvts=evts.filter(e=>e.date.startsWith(ms));
  const dEvts=evts.filter(e=>e.date===selDate).sort((a,b)=>a.start.localeCompare(b.start));
  return`
<div class="card" style="margin:14px 16px 12px">
  <div class="cal-nav">
    <button class="btn btn-s btn-sm" onclick="prevM()" style="min-width:40px">‹</button>
    <div class="cal-month-lbl">${calY}년 ${calM+1}월</div>
    <button class="btn btn-s btn-sm" onclick="nextM()" style="min-width:40px">›</button>
  </div>
  <div class="cal-grid">
    ${['일','월','화','수','목','금','토'].map(d=>`<div class="cal-wday">${d}</div>`).join('')}
    ${Array.from({length:FDY(calY,calM)},()=>`<div></div>`).join('')}
    ${Array.from({length:DIM(calY,calM)},(_,i)=>{
      const d=i+1;
      const ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const de=mEvts.filter(e=>e.date===ds);
      return`<div class="cal-day ${ds===TODAY?'is-today':''} ${ds===selDate?'is-sel':''}" onclick="selDate='${ds}';renderPage()">
        <div class="cal-dn">${d}</div>
        <div class="cal-dots">${de.slice(0,3).map(e=>`<div class="cal-dot" style="background:${e.color}"></div>`).join('')}</div>
      </div>`;
    }).join('')}
  </div>
</div>
<div class="sec" style="padding-top:0">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <div style="font-size:13px;color:var(--txt2)">${selDate} <span style="color:var(--grn)">(${dEvts.length}건)</span></div>
  </div>
  ${!dEvts.length?`<div class="empty" style="padding:28px 0"><div class="empty-ico">📅</div><div class="empty-txt">일정 없음</div></div>`:
    dEvts.map(e=>`
      <div class="ev-card" style="border-left-color:${e.color}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div style="min-width:0">
            <div style="font-weight:700;font-size:14px;margin-bottom:3px">${h(e.title)}</div>
            <div style="font-size:12px;color:var(--txt3)">${e.start}–${e.end} · ${h(e.group)}</div>
            <div style="font-size:11px;color:var(--txt3);margin-top:2px">${e.coach} · ${h(e.loc)}</div>
          </div>
          <div style="display:flex;gap:5px;flex-shrink:0">
            <button class="btn btn-s btn-xs" onclick="openEvtForm('${e.id}')">수정</button>
            <button class="btn btn-d btn-xs" onclick="delEvt('${e.id}')">삭제</button>
          </div>
        </div>
      </div>`).join('')}
</div>`;
}
function prevM(){if(calM===0){calY--;calM=11;}else calM--;renderPage();}
function nextM(){if(calM===11){calY++;calM=0;}else calM++;renderPage();}
function delEvt(id){evts=evts.filter(e=>e.id!==id);persist();renderPage();toast2('삭제되었습니다','err');}

function saveTypes(){
  _tSync();
  const clean=_et.map(t=>({name:(t.name||'').trim(),membership:!!t.membership})).filter(t=>t.name);

  if(new Set(names).size!==names.length){ toast2('수강 이름이 중복됩니다','err'); return; }
  cfg.ltypes=clean;
  normalizeCfg();   // 새 유형의 요금 칸 생성 + 삭제된 유형 정리
  persist(); toast2('수강 목록이 저장되었습니다'); openSettings();
  renderPage();
}

/* 요금표 편집 — 회원제: 구분별 1일 단가(성인·유소년 통합/분리 선택) / 비회원제: 1회 요금 */
let _pw=null;                 // 작업용 요금 { [name]: {통합? {all}:{성인,유소년}} 또는 {once} }
let _pu=null;                 // 작업용 통합 플래그 { [name]: bool }
let _pd=null;                 // 작업용 결제개월 할인율 { '2':n, '3':n }
function openPriceEditor(){
  _pw = clone(cfg.pricing);
  _pu = {}; cfg.ltypes.forEach(t=>{ if(t.membership) _pu[t.name]=!!t.unified; });
  _pd = clone(cfg.termDiscount||{'2':0,'3':0});
  renderPriceEditor();
}
const readPct=id=>{const el=$(id);return Math.max(0, Math.min(100, parseInt(String(el?.value||'0').replace(/[^0-9]/g,''))||0));};
// 화면 입력값을 작업 상태(_pw/_pd)로 회수 (재렌더/토글 전 호출)
function _pSync(){
  TERMS.forEach(t=>{ const v=$('td_'+t); if(v) _pd[t]=readPct('td_'+t); });
  cfg.ltypes.forEach((t,ti)=>{
    if(!t.membership){ _pw[t.name]={once:readInt('po_'+ti)}; return; }
    if(_pu[t.name]) _pw[t.name]={ all: readInt(`pm_${ti}_all`) };
    else { const o={}; CATS.forEach(cat=>{ o[cat]=readInt(`pm_${ti}_${CATK[cat]}`); }); _pw[t.name]=o; }
  });
}
function _pToggleUnified(ti,val){
  _pSync();
  const name=cfg.ltypes[ti].name, uni=(val==='통합'), cur=_pw[name]||{};
  if(uni){ _pw[name]={ all: (cur.all!=null?cur.all:(cur[CATS[0]]!=null?cur[CATS[0]]:cur[CATS[1]]))||0 }; }
  else   { const o={}; CATS.forEach(cat=>{ o[cat]=(cur[cat]!=null?cur[cat]:cur.all)||0; }); _pw[name]=o; }
  _pu[name]=uni;
  renderPriceEditor();
}
function renderPriceEditor(){
  const sections=cfg.ltypes.map((t,ti)=>{
    if(!t.membership){
      const once=(_pw[t.name]&&_pw[t.name].once)||0;
      return `<div style="font-size:13px;font-weight:700;color:${ltColor(t.name)};margin:16px 0 6px">${h(t.name)}
        <span style="color:var(--txt3);font-weight:400;font-size:10px">· 비회원제 · 1회(원)</span></div>
        <div class="fg"><label class="fl">1회 요금</label>
          <input class="fi" type="number" inputmode="numeric" id="po_${ti}" value="${once}"></div>`;
    }
    const uni=_pu[t.name];
    const p=_pw[t.name]||{};
    const toggle=`
      <select class="fi" style="width:auto;padding:6px 26px 6px 10px;font-size:11px;font-weight:700" onchange="_pToggleUnified(${ti}, this.value)">
        <option ${!uni?'selected':''}>분리</option>
        <option ${uni?'selected':''}>통합</option>
      </select>`;
    const body = uni
      ? `<div class="fg"><label class="fl">${CATS.join('·')} 공통 · 1일 단가</label>
           <input class="fi" type="number" inputmode="numeric" id="pm_${ti}_all" value="${p.all||0}"></div>`
      : `<div style="display:flex;gap:7px;flex-wrap:wrap">${CATS.map(cat=>`
           <div class="fg" style="flex:1 1 45%;margin:0"><label class="fl">${cat} · 1일 단가</label>
             <input class="fi" type="number" inputmode="numeric" id="pm_${ti}_${CATK[cat]}" value="${p[cat]||0}"></div>`).join('')}
         </div>`;
    return `<div style="display:flex;align-items:center;justify-content:space-between;margin:16px 0 4px;gap:8px">
        <div style="font-size:13px;font-weight:700;color:${ltColor(t.name)}">${h(t.name)}
          <span style="color:var(--txt3);font-weight:400;font-size:10px">· 회원제 · 1일 단가(원)</span></div>
        ${toggle}
      </div>${body}`;
  }).join('');
  showSheet('요금표 편집', `
    <div style="font-size:12px;color:var(--txt2);line-height:1.6;margin-bottom:2px">
      회원제는 <b style="color:var(--txt)">1일 단가</b>를 입력하면 결제금액 =
      1일단가 × 주횟수 × 4주 × 개월수(2·3달치)로 자동 계산됩니다.
      각 수강은 <b style="color:var(--txt)">구분(성인·청소년·유소년) 통합/분리</b>를 선택할 수 있습니다.
    </div>
    <div style="background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:11px 12px;margin-top:12px">
      <div style="font-size:11px;font-weight:700;color:var(--txt2);margin-bottom:6px">결제 개월 할인 (%)
        <span style="color:var(--txt3);font-weight:400">· 회원제 전체 공통</span></div>
      <div style="display:flex;gap:7px">
        <div class="fg" style="flex:1;margin:0"><label class="fl">2달치 할인</label>
          <input class="fi" type="number" inputmode="numeric" id="td_2" value="${_pd['2']||0}"></div>
        <div class="fg" style="flex:1;margin:0"><label class="fl">3달치 할인</label>
          <input class="fi" type="number" inputmode="numeric" id="td_3" value="${_pd['3']||0}"></div>
      </div>
    </div>
    ${sections}
    <div class="f-actions" style="margin-top:18px">
      <button class="btn btn-s" style="flex:1" onclick="openSettings()">‹ 뒤로</button>
      <button class="btn btn-g" style="flex:2" onclick="savePrice()">저장</button>
    </div>
  `);
}
function savePrice(){
  _pSync();
  cfg.ltypes.forEach(t=>{ if(t.membership) t.unified=!!_pu[t.name]; });
  cfg.pricing=_pw;
  cfg.termDiscount=clone(_pd);
  normalizeCfg();

function onTypeChange(){
  const mem=isMembership($('fty')?.value);
  ['wrapCat','wrapFreq','wrapTerm'].forEach(idn=>{ if($(idn)) $(idn).style.display = mem?'':'none'; });
  recalcFee();
}
function recalcFee(){
  const ty=$('fty')?.value, cat=$('fcat')?.value, term=$('fterm')?.value, freq=$('ffreq')?.value;
  const discount=Math.max(0,Math.min(100, parseInt($('fdisc')?.value||'0')||0));
  const mm={ltype:ty,cat,term,freq,discount};
  const fee=memberFee(mm), dp=discPct(mm);
  const unit=isMembership(ty)?`주${freq}회 · ${term==='3'?'3':'2'}달치`:'1일';
  const dtxt=dp>0?` · <span style="color:var(--org)">-${dp}%</span>`:'';
  if($('feeShow')) $('feeShow').innerHTML=
    `${W(fee)}<span style="font-family:'Noto Sans KR';font-size:11px;color:var(--txt3);font-weight:400"> / ${unit}${dtxt}</span>`;
}

function saveMember(id){
  const name=($('fn')?.value||'').trim();
  if(!name){toast2('이름을 입력하세요','err');return;}
  const data={name,phone:$('fp')?.value||'',birth:$('fb')?.value||'',
    ltype:$('fty')?.value||ltypeNames()[0],cat:$('fcat')?.value||'성인',
    freq:parseInt($('ffreq')?.value||'1')||1,term:$('fterm')?.value||'2',
    discount:Math.max(0,Math.min(100, parseInt($('fdisc')?.value||'0')||0)),
    group:$('fg_')?.value||cfg.groups[0],
    pos:$('fpos')?.value||'없음',coach:$('fco')?.value||cfg.coaches[0],
    status:$('fst')?.value||'활성',joinDate:$('fjd')?.value||TODAY,
    notes:$('fno')?.value||''};
  if(id){
    const i=members.findIndex(m=>m.id===id);
    if(i>-1){members[i]={...members[i],...data};toast2('수정되었습니다');}
  } else {
    const nm={id:'m'+Date.now(),...data,paid:false,paidDate:null};
    members.push(nm); att[nm.id]={}; toast2(name+' 등록 완료');
  }
  persist();
  closeSheet(); renderPage();
}

function delMember(id){
  if(!confirm('이 회원을 삭제하시겠습니까?')) return;
  members=members.filter(m=>m.id!==id); delete att[id];
  persist();
  closeSheet(); renderPage(); toast2('삭제되었습니다','err');
}

function togglePaid(id){
  const i=members.findIndex(m=>m.id===id);
  if(i>-1){members[i].paid=!members[i].paid; members[i].paidDate=members[i].paid?TODAY:null;}

/* ─── Bottom Sheet ───────────────────────────────────────────────────────────── */
function showSheet(title, html){
  $('sheetTitle').textContent=title;
  $('sheetBody').innerHTML=html;
  const ov=$('overlay'), sh=$('sheet');
  ov.style.display='block';
  // Force layout before transition
  ov.getBoundingClientRect();
  ov.classList.add('open');
  sh.classList.add('open');
}
function closeSheet(){
  const ov=$('overlay'), sh=$('sheet');
  ov.classList.remove('open');
  sh.classList.remove('open');
  // 재오픈(예: 상세 → 수정) 시 이전 닫기 타이머가 새 시트를 숨기지 않도록 가드
  setTimeout(()=>{ if(!ov.classList.contains('open')) ov.style.display='none'; },280);
}
// Tap overlay to close
$('overlay').addEventListener('click', function(e){
  if(e.target===this) closeSheet();
});

/* ─── Toast ──────────────────────────────────────────────────────────────────── */
let toastTmr;
function toast2(msg, type='ok'){
  const t=$('toast');
  t.textContent=(type==='ok'?'✅  ':'⚠️  ')+msg;
  t.className=`toast show ${type}`;
  clearTimeout(toastTmr);
  toastTmr=setTimeout(()=>{ t.className='toast'; }, 2400);
}

/* ─── Account / Sync UI ──────────────────────────────────────────────────────── */
function updateSyncBtn(){
  const b=$('syncBtn'); if(!b) return;
  const on=syncActive();
  b.classList.toggle('on',on);
  b.innerHTML=(on?'☁️':'👤')+'<span class="dot"></span>';
  b.title = on ? ('동기화 중 · '+(currentUser?.email||''))
               : (firebaseReady() ? '로그인하여 동기화' : '계정 · 동기화');
}

// Human-readable Korean messages for common Firebase auth error codes.
function authError(e){
  const m={
    'auth/invalid-email':'이메일 형식이 올바르지 않습니다',
    'auth/user-not-found':'등록되지 않은 계정입니다',
    'auth/wrong-password':'비밀번호가 올바르지 않습니다',
    'auth/invalid-credential':'이메일 또는 비밀번호가 올바르지 않습니다',
    'auth/email-already-in-use':'이미 가입된 이메일입니다',
    'auth/weak-password':'비밀번호는 6자 이상이어야 합니다',
    'auth/missing-password':'비밀번호를 입력하세요',
    'auth/network-request-failed':'네트워크 오류. 연결을 확인하세요',
    'auth/too-many-requests':'시도가 너무 많습니다. 잠시 후 다시 시도하세요',
    'auth/operation-not-allowed':'Firebase 콘솔에서 이메일/비밀번호 로그인을 활성화하세요'
  };
  return m[e && e.code] || (e && e.message) || '인증 오류';
}

function openSyncSheet(){
  const configured=firebaseReady();
  let inner;

  if(!configured){
    inner = `
    <div style="background:rgba(234,179,8,.1);border:1px solid rgba(234,179,8,.3);border-radius:10px;padding:12px 14px;font-size:12px;color:var(--ylw);line-height:1.65">
      ⚠️ 아직 Firebase가 설정되지 않아 <b>이 기기에만 저장</b>됩니다.<br><br>
      로그인·동기화를 켜려면 <code style="color:var(--txt)">index.html</code>의
      <code style="color:var(--txt)">FIREBASE_CONFIG</code>에 프로젝트 설정을 입력하고,
      Firebase 콘솔에서 <b>Authentication(이메일/비밀번호)</b>과
      <b>Realtime Database</b>를 활성화하세요.
    </div>
    <div class="f-actions" style="margin-top:16px">
      <button class="btn btn-s" style="flex:1" onclick="closeSheet()">닫기</button>
    </div>`;
  } else if(signedIn()){
    inner = `
    <div style="font-size:12px;color:var(--txt2);line-height:1.6;margin-bottom:16px">
      다른 기기에서도 <b style="color:var(--txt)">같은 계정</b>으로 로그인하면
      데이터가 실시간으로 동기화됩니다.
    </div>
    <div style="background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:14px;margin-bottom:14px">
      <div style="font-size:9px;color:var(--txt3);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px">로그인 계정</div>
      <div style="font-size:15px;font-weight:700;color:var(--txt);word-break:break-all">${h(currentUser.email||'(익명)')}</div>
      <div style="margin-top:10px;font-size:12px;color:var(--txt2)">
        상태: <b style="color:${syncActive()?'var(--grn)':'var(--org)'}">
          ${syncActive()?'● 실시간 동기화 중':'○ 연결 중…'}</b>
      </div>
    </div>
    <div class="f-actions">
      <button class="btn btn-s" style="flex:1" onclick="closeSheet()">닫기</button>
      <button class="btn btn-d" style="flex:1" onclick="doLogout()">로그아웃</button>
    </div>`;
  } else {
    inner = `
    <div style="font-size:12px;color:var(--txt2);line-height:1.6;margin-bottom:16px">
      PC와 휴대폰에서 <b style="color:var(--txt)">같은 계정</b>으로 로그인하면
      회원·출석·일정·수업료 데이터가 실시간으로 함께 유지됩니다.
    </div>
    <div class="fg"><label class="fl">이메일</label>
      <input class="fi" id="authEmail" type="email" inputmode="email" placeholder="you@example.com"
        autocapitalize="off" autocomplete="username" spellcheck="false"></div>
    <div class="fg"><label class="fl">비밀번호</label>
      <input class="fi" id="authPw" type="password" placeholder="6자 이상"
        autocomplete="current-password"></div>
    <div class="f-actions" style="margin-top:6px">
      <button class="btn btn-s" style="flex:1" onclick="doSignup()">회원가입</button>
      <button class="btn btn-g" style="flex:2" onclick="doLogin()">로그인</button>
    </div>
    <div style="font-size:11px;color:var(--txt3);margin-top:12px;line-height:1.5;text-align:center">
      처음이면 <b>회원가입</b>으로 계정을 만든 뒤, 다른 기기에서 같은 이메일로 로그인하세요.
    </div>`;
  }

  showSheet('계정 · 동기화', `<div id="authPanel">${inner}</div>`);
}

function _readAuthForm(){
  return {
    email:($('authEmail')?.value||'').trim(),
    pw:$('authPw')?.value||''
  };
}
function doLogin(){
  if(!fbAuth){ toast2('Firebase가 설정되지 않았습니다','err'); return; }
  const {email,pw}=_readAuthForm();
  if(!email||!pw){ toast2('이메일과 비밀번호를 입력하세요','err'); return; }
  fbAuth.signInWithEmailAndPassword(email,pw)
    .then(()=>{ closeSheet(); toast2('로그인되었습니다'); })
    .catch(e=>toast2(authError(e),'err'));
}
function doSignup(){
  if(!fbAuth){ toast2('Firebase가 설정되지 않았습니다','err'); return; }
  const {email,pw}=_readAuthForm();
  if(!email||!pw){ toast2('이메일과 비밀번호를 입력하세요','err'); return; }
  if(pw.length<6){ toast2('비밀번호는 6자 이상이어야 합니다','err'); return; }
  fbAuth.createUserWithEmailAndPassword(email,pw)
    .then(()=>{ closeSheet(); toast2('가입 및 로그인 완료'); })
    .catch(e=>toast2(authError(e),'err'));
}
function doLogout(){
  if(!fbAuth) return;
  fbAuth.signOut()
    .then(()=>{ closeSheet(); toast2('로그아웃되었습니다'); })
    .catch(e=>toast2(authError(e),'err'));
}

/* ─── Init ───────────────────────────────────────────────────────────────────── */
initData();
renderNav();
renderPage();
updateSyncBtn();
</script>
</body>
</html>
